[package]
name = "twitter-clone-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
argon2 = { version = "=0.6.0", features = ["zeroize"] }
axum = "=0.8.9"
chrono = { version = "=0.4.45", features = ["serde"] }
cookie = "=0.18.2"
csrf = "=0.5.0"
data-encoding = "=2.9.0"
email_address = "=0.2.9"
getrandom = "=0.4.3"
hex = "=0.4.3"
hmac = "=0.13.0"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1-rustls-tls"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "migrate", "macros", "uuid", "chrono"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync"] }
tower = { version = "=0.5.3", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "=0.7.1", features = ["limit"] }
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
zeroize = { version = "=1.9.1", features = ["serde"] }
